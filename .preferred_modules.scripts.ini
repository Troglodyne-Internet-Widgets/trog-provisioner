[Cpanel::JSON::XS]
[JSON::XS]
prefer = JSON
reason = "On a guest neither XS parser exists, and libjson-perl is what the pdns recipe installs"

[YAML]
[YAML::PP]
[YAML::Syck]
prefer = YAML::XS
reason = "Use a correct & fast YAML parser"

[Sereal]
[Storable]
prefer = JSON
reason = "JSON/YAML is preferred serialization format"

[File::Slurper]
prefer = File::Slurper::Temp
for = write_binary write_text
reason = "Avoid mangling files with concurrent writes"

[perl/rand]
prefer = Crypt::PRNG
reason = builtin rand() insecure

[perl/readdir]
reason="Use File::Find::find() instead"

[Term::ReadKey]
[IO::Prompt]
[IO::Prompt::Tiny]
[Term::Prompt]
[Prompt::Timeout]
prefer = IO::Prompter
reason = "One way to ask for input; it suppresses echo and copes with not having a terminal"
