ips=192.168.1.1
gateway=192.168.1.254
resolvers= 192.168.1.253, 8.8.8.8
image=https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
size=42949672960
memory=4092
cpus=2
packages= git, tig, perlbrew

# Which distribution this guest is, which decides the image above, the packager,
# and which version of each recipe names its packages.  Written by
# bin/new_config out of _global; defaults to ubuntu when absent.
distro=ubuntu
contact_email=george@troglodyne.net
# Default is host-passthrough so the guest sees the HV's real CPU
# (incl. AVX, needed by e.g. the bundled v8 in `claude`).  Set to
# host-model or a specific qemu CPU model if you need migratability.
#cpu_mode=host-passthrough

# Nothing here says which hypervisor to build on -- that is what
# hypervisors.conf is for, and this guest should be able to run on any of them.
# The one exception: pin it to a named hypervisor when it genuinely has to live
# on a particular machine.  It still has to fit, or provisioning refuses.
#hypervisor=hv1

# --- The guest's disks -------------------------------------------------------
#
# Everything the hypervisor side of the build takes is the `vm` recipe's, and
# `bin/recipes vm` prints it: what each key means, what it defaults to, and what
# happens when it is left out.  It used to be described here, in a comment block
# that had to be kept in step with a hardcoded list of key names in
# bin/new_config, and was not.
#
# All of them are optional and none are emitted blind: the vm recipe asks this
# hypervisor's libvirt and qemu what they will accept and leaves out anything
# they will not.  The guest's own side of the same disk is the `diskqueue`
# recipe.

#disk_cache=none
#disk_io=io_uring
#disk_detect_zeroes=unmap
#disk_iothreads=1
#disk_queues=4
#disk_logical_block_size=512
#disk_physical_block_size=4096
#disk_total_iops_sec=2000
#disk_read_iops_sec=1500
#disk_write_iops_sec=500
#disk_total_bytes_sec=104857600
#disk_read_bytes_sec=104857600
#disk_write_bytes_sec=52428800

# What the guest ends up calling its two interfaces.  Both are worked out from
# the PCI slots the domain XML pins them to (ens3 for the libvirt NAT, ens4 for
# the outbound bridge), and cloud-init matches them by MAC rather than by name,
# so you only need these if your image names interfaces some other way.
#dhcp_devname=ens3
#bridge_devname=ens4
