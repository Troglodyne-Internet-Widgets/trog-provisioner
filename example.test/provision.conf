# Default is host-passthrough so the guest sees the HV's real CPU
# (incl. AVX, needed by e.g. the bundled v8 in `claude`).  Set to
# host-model or a specific qemu CPU model if you need migratability.
#cpu_mode=host-passthrough
# PCI passthrough: comma-separated addresses for GPU/hw-accel devices.
# Find addresses with: lspci -D | grep -i 'vga\|3d\|display'
# Prerequisites: IOMMU enabled in BIOS + kernel (intel_iommu=on / amd_iommu=on),
# device bound to vfio-pci driver before provisioning.
# Include all functions of a device (e.g. GPU at .0 and its audio at .1).
#gpu_pci=0000:01:00.0,0000:01:00.1
