ips=192.168.1.1
gateway=192.168.1.254
resolvers= 192.168.1.253, 8.8.8.8
image=https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
size=42949672960
packages= git, tig, perlbrew
contact_email=george@troglodyne.net
# Default is host-passthrough so the guest sees the HV's real CPU
# (incl. AVX, needed by e.g. the bundled v8 in `claude`).  Set to
# host-model or a specific qemu CPU model if you need migratability.
#cpu_mode=host-passthrough

# Which hypervisor to build on.  Omit for "this machine" (qemu:///system).
# Any libvirt connection string works; --connect on the command line wins.
#libvirt_uri=qemu+ssh://root@hv1.example.net/system
# Only needed when the URI's transport gives us no shell (tcp/tls), or when the
# HV is reachable at a different address than libvirt uses.
#hv_ssh_host=hv1.mgmt.example.net
#hv_ssh_user=ops
#hv_ssh_port=2200
# Skip bridge autodetection if `brctl show | tail -n1` guesses wrong.
#bridge_device=br0
#virbr_device=virbr0
# Where the tf_disks storage pool lives on the HV.
#pool_path=/opt/terraform/disks
