packages= git, tig, perlbrew
contact_email=george@troglodyne.net
# Default is host-passthrough so the guest sees the HV's real CPU
# (incl. AVX, needed by e.g. the bundled v8 in `claude`).  Set to
# host-model or a specific qemu CPU model if you need migratability.
#cpu_mode=host-passthrough

# Nothing here says which hypervisor to build on -- that is what
# hypervisors.conf is for, and this guest should be able to run on any of them.
# The one exception: pin it to a named hypervisor when it genuinely has to live
# on a particular machine.  It still has to fit, or provisioning refuses.
#hypervisor=hv1

# --- The guest's disks -------------------------------------------------------
#
# Everything below is optional, and every one of them is checked against what
# the hypervisor's libvirt and qemu will actually accept before it is written
# into the domain -- see mongle_disk_tuning in bin/provision.  A knob the
# hypervisor is too old for is left out rather than emitted and hoped for.
#
# The guest's own side of this is the `diskqueue` recipe, which sets the I/O
# scheduler and readahead inside the guest.

# How the host caches this disk.  Default is `none` -- O_DIRECT, so the host
# does not hold a second copy of every block the guest is already caching,
# which is memory hypervisors.conf is not counting when it decides what else
# fits.  What you give up is the shared base image: every guest is an overlay
# on one file, and `writeback` lets the host cache that file once for all of
# them.
#
# Whether the pool can do O_DIRECT at all is settled by writing a block to it
# with O_DIRECT rather than by knowing which filesystem it is, and a pool that
# refuses is downgraded to `writeback` with a reason printed.  A pool on ZFS is
# worth a thought even when it does take one: the ARC is already a cache, and
# Direct I/O bypasses it as well as the page cache.
#disk_cache=none

# The AIO backend.  Left to qemu unless set.  `io_uring` is one ring shared
# with the kernel rather than a worker thread and a syscall per request, and
# needs libvirt 6.3 with qemu 5.0 behind it.  `native` and `threads` are the
# older two.
#disk_io=io_uring

# Detect all-zero writes and, with the discard path on, punch them out of the
# image.  Off by default: it is a check on every write for space the guest
# never asked to reclaim, and the guest's weekly fstrim already reclaims what
# it actually freed.  Worth turning on for a guest that writes zeros in bulk.
#disk_detect_zeroes=unmap

# How many threads qemu processes this guest's disk requests on.  Default 1,
# which is what gets submission off qemu's main loop -- where it is otherwise
# serialised against everything else that loop is doing.  More than one is
# worth asking for on a guest with several busy disks; one disk's queues are
# only spread across several threads on libvirt 10 with qemu 9, and on
# anything older the pool is still used, one disk to a thread.
#disk_iothreads=1

# Virtqueues on the disk.  Defaults to the vcpu count.
#disk_queues=4

# What the guest is told its sectors are.  Default 512 logical, 4096 physical,
# so a guest lays its filesystem out for 4K rather than doing read-modify-write
# against 4K hardware for the life of the disk.  This has to be right *before*
# the guest's filesystem is made; changing it afterwards realigns nothing.
#disk_logical_block_size=512
#disk_physical_block_size=4096

# Throttles.  Unset by default: hypervisors.conf reserves memory, CPUs and disk
# space and reserves nothing of the I/O every guest on the machine is sharing a
# queue for, and this is the knob that answers that -- one guest running a
# backup can otherwise flatten every other guest in the pool.
#
# libvirt applies these per disk rather than per domain, so a guest with three
# disks can do three times what a number here says.  A total may not be given
# alongside the halves it is the total of; provisioning refuses rather than
# letting libvirt decide which one it meant.
#disk_total_iops_sec=2000
#disk_read_iops_sec=1500
#disk_write_iops_sec=500
#disk_total_bytes_sec=104857600
#disk_read_bytes_sec=104857600
#disk_write_bytes_sec=52428800

# What the guest ends up calling its two interfaces.  Both are worked out from
# the PCI slots the domain XML pins them to (ens3 for the libvirt NAT, ens4 for
# the outbound bridge), and cloud-init matches them by MAC rather than by name,
# so you only need these if your image names interfaces some other way.
#dhcp_devname=ens3
#bridge_devname=ens4
