# Read by [PrereqsFile] in dist.ini, for prerequisites [AutoPrereqs] cannot find
# in the code.  The perl floor is here as well as on the use line of every file,
# so the metadata states it even where one file leaves that line out.
runtime:
  requires:
    perl: '5.014'
# t/repos_for.t loads scripts/repos_for, which uses Pithub.  [AutoPrereqs]
# cannot see that use: it reads only the files under lib/, bin/ and t/, and
# the test loads the script when it runs.
test:
  requires:
    Pithub: '0'
