name = Provisioner-Recipe
version = 1.000
author = George S. Baugh <george@troglodyne.net>
license = MIT
copyright_holder = Troglodyne LLC
copyright_year = 2026

[GatherDir / LibFiles ]
include_untracked = 1
exclude_match = .*\.swp
exclude_match = .*\.swo
root = ./lib
prefix = lib

[GatherDir / BuildConf ]
root = ./conf
prefix = .

[GatherDir / BinFiles ]
root = ./bin
prefix = bin

[GatherDir / TestFiles ]
root = ./t
prefix = t

[GatherDir / ExtraTestFiles ]
root = ./xt
prefix = xt

[PkgVersion]
[AutoPrereqs]
[MetaProvides::Package]

[FileFinder::Filter / NoBin]
finder = :InstallModules ;

[PodWeaver]
finder=NoBin

[Git::Contributors]

[@TestingMania]
critic_config = perlcriticrc

[TestRelease]
[ConfirmRelease]
[UploadToCPAN]

[CheckMetaResources]
[CheckPrereqsIndexed]
[CheckChangesHasContent]

[GithubMeta]
issues = 1
user = teodesian

; `dzil authordeps` doesn't know about the Pod Weaver dependencies:
; authordep Pod::Weaver::Section::Contributors = 0
; authordep Pod::Weaver::Plugin::Encoding = 0
; authordep Pod::Weaver::Section::SeeAlso = 0
; authordep Pod::Weaver::Section::GenerateSection = 0
; authordep Pod::Elemental::Transformer::List = 0
