name = Provisioner-Recipe
version = 1.000
author = George S. Baugh <george@troglodyne.net>
license = MIT
copyright_holder = Troglodyne LLC
copyright_year = 2026

; Simpler than doing include_dotfiles, and due to other dzil brain damage
[Run::BeforeBuild]
run = rm -rf .build/*
[Run::Test]
run = cp $(git rev-parse --show-toplevel)/.perltidyrc            .perltidyrc
run = cp $(git rev-parse --show-toplevel)/.perlcriticrc          .perlcriticrc
run = cp $(git rev-parse --show-toplevel)/.perlcriticrc.scripts  .perlcriticrc.scripts
run = cp $(git rev-parse --show-toplevel)/.preferred_modules.ini .preferred_modules.ini
run = cp $(git rev-parse --show-toplevel)/.preferred_modules.scripts.ini .preferred_modules.scripts.ini
run = cp $(git rev-parse --show-toplevel)/.preferred_binaries.ini .preferred_binaries.ini
run = cp $(git rev-parse --show-toplevel)/.pod_stopwords         .pod_stopwords
run = cp $(git rev-parse --show-toplevel)/LICENSE                LICENSE
run = echo .perltidyrc >> MANIFEST
run = echo .perlcriticrc >> MANIFEST
run = echo .perlcriticrc.scripts >> MANIFEST
run = echo .preferred_modules.ini >> MANIFEST
run = echo .preferred_modules.scripts.ini >> MANIFEST
run = echo .preferred_binaries.ini >> MANIFEST
run = echo .pod_stopwords >> MANIFEST
[GatherDir]
exclude_filename = AGENTS.md
exclude_filename = VISION.md
exclude_filename = STYLE.md
exclude_filename = MAINTENANCE.md
exclude_filename = ipmap.cfg
exclude_filename = recipes.yaml
exclude_filename = secrets.kdbx
exclude_filename = LICENSE
exclude_match    = cover_db/.+
exclude_match    = docs/.+
exclude_match    = git-hooks/.+
exclude_match    = recipes.d/.+
[MetaYAML]
[MetaJSON]
[License]
[Readme]
[InstallGuide]
[ExtraTests]
[ExecDir]
[ShareDir]
[MakeMaker]
[Manifest]
[PruneFiles]
[PruneCruft]
[ManifestSkip]
[Git::Check]
    allow_dirty = dist.ini
    allow_dirty = Changes
[Git::Commit / Release_Commit]
    allow_dirty = dist.ini
    allow_dirty = Changes
    add_files_in = /
    commit_msg = %v%n%n%c
[Git::Tag]
    tag_format = %v
    tag_message = %v
[Git::Push]
[TestRelease]
[ConfirmRelease]
[UploadToCPAN]
[MetaMergeFile]
[PrereqsFile]
[MetaNoIndex]
    directory = t
    directory = templates
    directory = docs
[MetaProvides::Package]
    inherit_version = 0

[AutoPrereqs]

; AutoPrereqs finds Net::OpenSSH::More from the use statements, but has no way
; to know which version of it matters.  1.03 is the first that waits out
; retry_interval between attempts and understands retry_on_auth_failure.
; Against 1.02 wait_for_ssh gets a single attempt rather than the fifty it asks
; for, and a guest whose authorized_keys cloud-init is still writing fails a
; provision that was going perfectly well -- silently, because an option that
; release does not recognise is merged into its own opts and never acted on.
[Prereqs / RuntimeRequires]
Net::OpenSSH::More = 1.03

[PkgVersion]

[PodWeaver]
[Git::Contributors]

[@TestingMania]
critic_config = .perlcriticrc
changelog = CHANGES
disable = Test::Portability

[CheckMetaResources]
[CheckPrereqsIndexed]
[CheckChangesHasContent]

[GithubMeta]
issues = 1
user = teodesian

; `dzil authordeps` doesn't know about the Pod Weaver dependencies:
; authordep Pod::Weaver::Section::Contributors = 0
; authordep Pod::Weaver::Plugin::Encoding = 0
; authordep Pod::Weaver::Section::SeeAlso = 0
; authordep Pod::Weaver::Section::GenerateSection = 0
; authordep Pod::Elemental::Transformer::List = 0

; Nor are the extensions to dzil itself...
; authordep Dist::Zilla::App::Command::cover

; Not a build dependency but a critic one: [CompileTime] compiles what it
; critiques, so scripts/repos_for cannot be checked without what it uses.
; authordep Pithub = 0

; Nor are the perl-critic deps included...
