; What this repository has already decided about shelling out, read by
; Perl::Critic::Policy::PreferredBinaries through .perlcriticrc.
;
; An entry belongs here when the codebase has an answer in perl for running
; that binary on this machine.  Commands run on another machine are not this
; file's concern: Trog::Machine's run_cmd, capture_cmd and run_sudo send them to
; wherever the machine is, and are named so that the policy does not read them
; as local runners.  So the curl in Trog::HV that fetches the base image on the
; hypervisor is not what the curl entry below is about.
;
; Nothing in perl does what brctl and qemu-img do, so they are not listed.

[ssh-keygen]
prefer = Provisioner::Utils::write_ssh_keypair
reason = "In-process, and it rewraps the ed25519 PEM that CryptX would otherwise refuse -- see its POD"

[ssh-keygen -y]
prefer = Provisioner::Utils::ssh_pubkey_from_private
reason = "Derives the public half with CryptX, for RSA, Ed25519 and ECDSA alike"

[virsh]
prefer = Sys::Virt (Trog::HV->vmm)
reason = "The libvirt API rather than virsh output; Trog::HV already holds the connection"

[curl]
prefer = HTTP::Tiny
reason = "The HTTP client this repository already uses, in Provisioner::Recipe::garage and ::ubuntu"

[wget]
prefer = HTTP::Tiny
reason = "The HTTP client this repository already uses, in Provisioner::Recipe::garage and ::ubuntu"
