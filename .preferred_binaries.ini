; What this repository has already decided about shelling out, read by
; Perl::Critic::Policy::PreferredBinaries through .perlcriticrc.
;
; An entry belongs here when the codebase has an answer in perl that works at
; every site the policy will flag.  The policy sees ->run and ->capture as well
; as system and backticks, so a Trog::Machine call on the hypervisor counts too.
;
; Which is why these are deliberately absent:
;
;   curl      The one curl is Trog::HV fetching the base image on the
;             hypervisor.  HTTP::Tiny cannot make a download happen over there.
;   coreutils cat, rm, mkdir, stat and the rest run through Trog::Machine,
;             which is the in-perl answer -- those calls are how it is built.
;   brctl, qemu-img
;             Nothing in perl does what these do.

[ssh-keygen]
prefer = Provisioner::Utils::write_ssh_keypair
reason = "In-process, and it rewraps the ed25519 PEM that CryptX would otherwise refuse -- see its POD"

[ssh-keygen -y]
prefer = Provisioner::Utils::ssh_pubkey_from_private
reason = "Derives the public half with CryptX, for RSA, Ed25519 and ECDSA alike"

[virsh]
prefer = Sys::Virt (Trog::HV->vmm)
reason = "The libvirt API rather than virsh output; Trog::HV already holds the connection"
