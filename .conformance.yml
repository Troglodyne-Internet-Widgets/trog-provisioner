flavor: troglodyne-5.040
source:
  git: https://github.com/Troglodyne-Internet-Widgets/perl-slop-plugin.git
  path: skills/packaging-perl
variables:
  DIST: Provisioner-Recipe
  AUTHOR_NAME: George S. Baugh
  AUTHOR_EMAIL: george@troglodyne.net
  COPYRIGHT_HOLDER: Troglodyne LLC
  YEAR: '2026'
  GITHUB_USER: Troglodyne-Internet-Widgets
  CPAN_ID: TEODESIAN
  DATE: '2026-11-13'
checks:
  CriticProfile:
    overrides:
      NamingConventions::Capitalization:
        package_exemptions: main [a-z][a-z0-9_]*
      Plicease::ProhibitLeadingZeros:
        allow: Provisioner::Utils::write_pem Test::MockFile::new_dir
      PreferredBinaries:
        config: .preferred_binaries.ini
      ProhibitUnusedDefinitions:
        allow_subs: inspection_address secret_blocks guest_of_with_agent check_client
          check_transfer_route check_reachable check_transfer_ip check_rsync check_sandbox
          check_gpg check_fetch_sources check_config check_passwordless_sudo check_iso_builder
          check_libvirt check_sys_virt_in_step check_pool_writable check_virtiofs
          check_guest_bridges check_guest_networks check_bridge_acl check_guest_pool
          check_cloud_resources check_cloud_quota check_linode_resources check_linode_budget
          check_solusvm_resources check_solusvm_quota note_stale_image note_apt_mirror
          note_libguestfs note_swtpm note_pool_quota note_stale_base_image note_log_destination
          note_plaintext_secrets Trog::OpenStack::Auth::token Trog::OpenStack::Auth::region
          Trog::OpenStack::Auth::interface forget forget_sudo_passwords
      ProhibitUnusedImports:
        allow: IO::Prompter Text::Xslate::Bridge::TT2
      Variables::ProhibitUnusedVarsStricter:
        allow_if_computed_by: Test::MockModule->new Test::MockFile->file Test::MockFile->new_dir
          pushd with_capacity with_vmm with_registrar guest_that cloud_hv here http
          with_fleet
      # The programs run from the checkout until a release, and #!perl, which the
      # standards are about to require, works only once installed.
      logicLAB::RequireSheBang:
        formats: '#!/usr/bin/env perl'
