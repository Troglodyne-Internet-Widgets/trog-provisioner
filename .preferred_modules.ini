[JSON]
[JSON::PP]
[JSON::XS]
prefer = Cpanel::JSON::XS
reason = "Use a correct & fast JSON parser"

[YAML]
[YAML::PP]
[YAML::Syck]
prefer = YAML::XS
reason = "Use a correct & fast YAML parser"

[Sereal]
[Storable]
prefer = Cpanel::JSON::XS
reason = "JSON/YAML is preferred serialization format"

[File::Slurper]
prefer = File::Slurper::Temp
for = write_binary write_text
reason = "Avoid mangling files with concurrent writes"

[perl/rand]
prefer = Crypt::PRNG
reason = builtin rand() insecure

[perl/readdir]
reason="Use File::Find::find() instead"

[Term::ReadKey]
[IO::Prompt]
[IO::Prompt::Tiny]
[Term::Prompt]
[Prompt::Timeout]
prefer = IO::Prompter
reason = "One way to ask for input; it suppresses echo and copes with not having a terminal"

[perl/ssh-keygen]
prefer = Net::SSH::Perl::Key
reason = "Generate keys in-process.  Note that write_private emits unwrapped PEM, which CryptX refuses; rewrap at 64 columns"

[perl/ssh-keygen -y]
prefer = Provisioner::Utils::ssh_pubkey_from_private
reason = "Derive a public half with CryptX rather than a process; handles RSA, Ed25519 and ECDSA"
